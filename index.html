<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBSU T2 OT Claim</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
,::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f5f4f0;--surface:#fff;--border:#e2dfd8;--bmed:#c5c0b8;
--text:#1a1a18;--muted:#6b6860;--faint:#aaa8a2;
--green:#1a7a4a;--gbg:#eaf5ef;--gbd:#b6dfc7;
--amber:#8a5a00;--abg:#fef8e7;--abd:#f0d080;
--red:#a02020;--rbg:#fdf0f0;--rbd:#f0c0c0;
--blue:#1a4a8a;--bbg:#eef4fd;--bbd:#b8d0f5;
--r:10px;--rs:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.app{max-width:1200px;margin:0 auto;padding:24px 16px 60px;}
.main-left{width:100%;}
h1{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
.sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.steps{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);padding:2px 6px 2px 0}
.step.active{color:var(--text);font-weight:700}
.step.done{color:var(--green)}
.snum{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bmed);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.step.active .snum{background:var(--text);color:#fff;border-color:var(--text)}
.step.done .snum{background:var(--gbg);color:var(--green);border-color:var(--gbd)}
.sarr{color:var(--bmed);font-size:13px;margin:0 1px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px}
.ctitle{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ctag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.uz{display:block;border:1.5px dashed var(--bmed);border-radius:var(--rs);padding:16px 10px;text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.uz:hover{border-color:var(--text);background:var(--bg)}
.uz.done{border-style:solid;border-color:var(--gbd);background:var(--gbg)}
.uz input[type="file"]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.uzi{font-size:22px;margin-bottom:4px}
.uzl{font-size:13px;font-weight:600}
.uzs{font-size:11px;color:var(--muted);margin-top:2px}
.uzf{font-size:11px;color:var(--green);margin-top:4px;font-weight:600;word-break:break-all;line-height:1.3}
.uzth{max-width:100%;max-height:70px;border-radius:4px;margin-top:5px;object-fit:cover}
.apibox{background:var(--abg);border:1px solid var(--abd);border-radius:var(--rs);padding:11px 13px;margin-bottom:12px}
.apibox label{display:block;font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.apibox input,.apibox select{width:100%;font-size:13px;padding:6px 9px;border-radius:var(--rs);border:1px solid var(--abd);background:#fff;color:var(--text);font-family:monospace}
.apigrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
@media(max-width:640px){.apigrid{grid-template-columns:1fr}}
.apihint{font-size:11px;color:var(--amber);margin-top:4px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);border:1px solid var(--bmed);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;transition:all .15s;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn.primary:hover{opacity:.85}
.btn.preview{background:var(--bbg);color:var(--blue);border-color:var(--bbd);font-weight:700}
.btn.preview:hover{background:#dfeafb;border-color:#8fb2e8}
.btn.preview:disabled{background:var(--bbg);color:var(--blue);border-color:var(--bbd)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.bgrp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.alert{font-size:12px;padding:8px 11px;border-radius:var(--rs);margin:7px 0;line-height:1.5}
.alert.err{background:var(--rbg);color:var(--red);border:1px solid var(--rbd)}
.alert.ok{background:var(--gbg);color:var(--green);border:1px solid var(--gbd)}
.alert.warn{background:var(--abg);color:var(--amber);border:1px solid var(--abd)}
.sbox{position:relative;margin-bottom:8px}
.sbox input{width:100%;font-size:13px;padding:7px 11px 7px 30px;border-radius:var(--rs);border:1px solid var(--bmed);background:var(--surface);color:var(--text);font-family:inherit}
.sbox input:focus{outline:none;border-color:var(--text)}
.sbox::before{content:'\2315';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px;pointer-events:none}
.holdbox{background:#f0f4ff;border:1px solid var(--bbd);border-radius:var(--rs);padding:12px;margin-bottom:12px}
.holdbox label{display:block;font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.holdbox textarea{width:100%;font-size:12px;padding:7px 9px;border-radius:var(--rs);border:1px solid var(--bbd);background:#fff;color:var(--text);font-family:inherit;resize:vertical;outline:none}
.holdbox textarea:focus{border-color:var(--blue)}
.holdbox .hint{font-size:11px;color:var(--blue);margin-top:5px;opacity:.8}
.ftbl{width:100%;border-collapse:collapse;font-size:12px}
.ftbl th{padding:6px 9px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
.ftbl td{padding:6px 9px;border-bottom:1px solid var(--border);vertical-align:top}
.ftbl tbody tr:last-child td{border-bottom:none}
.ftbl tbody tr:hover{background:#fafaf8}
.cstags{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.cstag{display:inline-flex;align-items:center;gap:2px;font-size:11px;padding:2px 6px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:default}
.cstag.pb{border-color:#c0d8f0;background:#eef4fd;color:#1a4a8a}
.cstag.gs{border-color:#c8e8c8;background:#eaf5ea;color:#1a6a2a}
.cstag.rs{border-color:var(--abd);background:var(--abg);color:var(--amber)}
.cstag .rm{background:none;border:none;cursor:pointer;color:inherit;opacity:.5;font-size:11px;line-height:1;padding:0 0 0 2px;font-family:inherit}
.cstag .rm:hover{opacity:1}
.addcs{font-size:11px;padding:2px 6px;border-radius:7px;border:1px dashed var(--bmed);background:none;color:var(--muted);cursor:pointer;font-family:inherit}
.addcs:hover{border-color:var(--text);color:var(--text)}
.delrow{background:none;border:none;cursor:pointer;color:var(--faint);font-size:14px;padding:2px;border-radius:4px}
.delrow:hover{background:var(--rbg);color:var(--red)}
input.inl{font-size:12px;padding:3px 6px;border:1px solid var(--bmed);border-radius:4px;background:var(--surface);color:var(--text);font-family:inherit}
input.inl:focus{outline:none;border-color:var(--text)}
input.csedit{font-size:11px;padding:3px 6px;border:1px solid var(--bbd);border-radius:5px;background:var(--bbg);color:#1a4a8a;font-family:inherit;min-width:110px}
input.csedit:focus{outline:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:10px;text-align:center}
.statn{font-size:24px;font-weight:700}
.statl{font-size:11px;color:var(--muted);margin-top:1px}
.twrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--rs)}
table.ot{width:100%;border-collapse:collapse;font-size:12px;min-width:800px}
table.ot thead{background:var(--bg)}
table.ot th{padding:7px 9px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap}
table.ot td{padding:6px 9px;border-bottom:1px solid var(--border);vertical-align:middle}
table.ot tbody tr:last-child td{border-bottom:none}
table.ot tbody tr:hover{background:#fafaf8}
table.ot tbody tr.skiprow{opacity:.45}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:9px;font-weight:700;white-space:nowrap}
.tag.ot{background:var(--gbg);color:var(--green);border:1px solid var(--gbd)}
.tag.skip{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.tag.nf{background:var(--abg);color:var(--amber);border:1px solid var(--abd)}
.tag.nhb{background:#fffde7;color:#7a6000;border:1px solid #f0d840}
.tag.crf{background:var(--bbg);color:var(--blue);border:1px solid var(--bbd)}
.tag.t22{background:#f3e8ff;color:#7c3aed;border:1px solid #ddd6fe}
.noteinp{width:100%;font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font-family:inherit}
.noteinp:focus{outline:none;border-color:var(--text)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay{display:none;position:fixed;inset:0;background:rgba(245,244,240,.9);z-index:200;align-items:center;justify-content:center}
#overlay.show{display:flex}
.lb{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 40px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.bspin{width:36px;height:36px;border:3px solid var(--bmed);border-top-color:var(--text);border-radius:50%;animation:spin .65s linear infinite;margin:0 auto 11px}
.lb p{font-size:14px;font-weight:600}
.lb .lsub{font-size:12px;color:var(--muted);margin-top:3px}
@media(max-width:640px){.ugrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
